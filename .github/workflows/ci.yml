name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (avoid double-spec).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ ships node:sqlite, used to integration-test the production D1 store.
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Vitest includes the EDI round-trip spike + (from M1) the injection harness
      # at the benchmark bar; PRs touching engine packages fail below bar (docs/07).
      - name: Test
        run: pnpm test
